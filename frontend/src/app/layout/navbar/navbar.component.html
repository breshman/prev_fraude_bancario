<nav class="navbar navbar-expand-lg bg-body border-bottom shadow-sm px-4 py-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1 fw-bold text-primary d-md-none">Security Flow Bank</span>
    <div class="d-none d-md-flex align-items-center">
      <span class="text-body-secondary fw-semibold">Panel de Control Global</span>
    </div>

    <div class="d-flex align-items-center ms-auto">
      <!-- Botón de Alternancia de Tema Claro / Oscuro -->
      <button class="btn btn-sm btn-outline-secondary rounded-pill me-3 d-flex align-items-center gap-2 px-3 py-2 theme-toggle-btn"
        (click)="toggleTheme()"
        [title]="themeService.isDark() ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'"
        type="button">
        <span class="fs-6">{{ themeService.isDark() ? '☀️' : '🌙' }}</span>
        <span class="d-none d-sm-inline small fw-semibold">
          {{ themeService.isDark() ? 'Modo Claro' : 'Modo Oscuro' }}
        </span>
      </button>

      <!-- Perfil de Usuario con Dropdown y Logout -->
      @if (authService.currentUser$ | async; as user) {
        <div class="dropdown">
          <button class="btn btn-link text-decoration-none p-0 d-flex align-items-center border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2 shadow-sm"
              style="width: 38px; height: 38px; font-weight: bold; font-size: 0.85rem;">
              {{ getInitials(user.nombreUsuario) }}
            </div>
            <div class="d-none d-md-block text-start me-2">
              <div class="fw-bold fs-6 text-body" style="line-height: 1;">{{ user.nombreUsuario }}</div>
              <small class="text-primary fw-medium" style="font-size: 0.72rem;">{{ user.roles[0] || 'ANALISTA' }}</small>
            </div>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-secondary-subtle">
            <li><h6 class="dropdown-header">Usuario Activo: {{ user.nombreUsuario }}</h6></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item text-danger d-flex align-items-center gap-2" (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                  <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                </svg>
                <span>Cerrar Sesión</span>
              </button>
            </li>
          </ul>
        </div>
      } @else {
        <!-- Botón rápido de login si no hay sesión -->
        <a routerLink="/login" class="btn btn-sm btn-primary rounded-pill px-3">
          Iniciar Sesión
        </a>
      }
    </div>
  </div>
</nav>
