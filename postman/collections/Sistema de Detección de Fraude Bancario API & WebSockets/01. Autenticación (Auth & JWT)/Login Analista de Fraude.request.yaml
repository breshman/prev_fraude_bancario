$kind: http-request
name: Login Analista de Fraude
description: Autentica al analista y extrae automáticamente el JWT a la variable {{authToken}}.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombreUsuario": "analista_seguridad",
      "password": "Admin1234#"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test('Token JWT generado y guardado', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.token).to.be.a('string');
          pm.collectionVariables.set('authToken', jsonData.token);
          console.log('JWT Token asignado a {{authToken}}');
      });
    language: text/javascript
order: 1000
