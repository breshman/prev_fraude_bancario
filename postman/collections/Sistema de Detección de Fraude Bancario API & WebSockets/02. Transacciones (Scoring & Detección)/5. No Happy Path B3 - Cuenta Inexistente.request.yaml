$kind: http-request
description: Valida error de negocio cuando la cuenta origen no existe en el sistema bancario.
url: "{{baseUrl}}/api/v1/transacciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numeroCuentaOrigen": "CUENTA-FANTASMA-999",
      "numeroCuentaDestino": "CTA-002-998811",
      "monto": 100.00,
      "moneda": "PEN",
      "canal": "APP",
      "tipoTransaccion": "TRANSFERENCIA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 Not Found', function () {
          pm.expect(pm.response.code).to.eql(404);
      });
    language: text/javascript
order: 5000
